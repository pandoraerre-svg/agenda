<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gothic Paper & Ink - Panel Maestro & Agenda</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Góticas, Victorianas y Manuscritas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=Great+Vibes&family=MedievalSharp&family=UnfrakturMaguntia&family=Uncial+Antiqua&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            goth: {
              bg: 'var(--color-bg)',
              paper: 'var(--color-paper)',
              primary: 'var(--color-primary)',
              secondary: 'var(--color-secondary)',
              accent: 'var(--color-accent)',
              text: 'var(--color-text)',
            }
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --color-bg: #0f0a15;
      --color-paper: #181124;
      --color-primary: #7e22ce;
      --color-secondary: #3b0764;
      --color-accent: #4d7c0f;
      --color-text: #f3e8ff;
      --font-family: 'Cinzel', serif;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-family);
      transition: background-color 0.3s, color 0.3s;
    }

    .font-custom {
      font-family: var(--font-family);
    }

    /* Patrones de Papel */
    .paper-grid {
      background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 0);
      background-size: 20px 20px;
    }
    .paper-lines {
      background-image: linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 0);
      background-size: 100% 28px;
    }
    .paper-dots {
      background-image: radial-gradient(rgba(255, 255, 255, 0.2) 1.5px, transparent 0);
      background-size: 16px 16px;
    }

    /* Temas de Fondo de Hoja */
    .sheet-theme-vampiric {
      background-image: linear-gradient(rgba(15, 10, 21, 0.85), rgba(15, 10, 21, 0.85)), url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=1000&q=80');
      background-size: cover;
      background-position: center;
    }
    .sheet-theme-herbarium {
      background-color: #241408;
      background-image: linear-gradient(rgba(36, 20, 8, 0.85), rgba(36, 20, 8, 0.85)), url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1000&q=80');
      background-size: cover;
    }
    .sheet-theme-crimson {
      background-color: #1a050a;
      border: 3px double #991b1b;
      box-shadow: inset 0 0 30px rgba(153, 27, 27, 0.3);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: var(--color-primary); border-radius: 3px; }

    .interactive-element {
      user-select: none;
      touch-action: none;
      cursor: grab;
    }
    .interactive-element:active { cursor: grabbing; }
  </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row overflow-x-hidden">

  <!-- BARRA LATERAL / NAVEGACIÓN Y TO-DO LIST INTEGRADA -->
  <aside class="w-full md:w-80 bg-black/50 backdrop-blur-md border-b md:border-b-0 md:border-r border-purple-900/40 p-4 flex flex-col justify-between z-20">
    <div>
      <!-- Título -->
      <div class="text-center py-3 border-b border-purple-900/30 mb-4">
        <h1 class="text-xl font-bold tracking-widest text-purple-400 font-custom flex items-center justify-center gap-2">
          <i class="fa-solid fa-book-skull"></i> VERBENA
        </h1>
        <p class="text-[10px] text-purple-300/60 tracking-wider uppercase mt-1">Gothic Paper & Ink</p>
      </div>

      <!-- Menú de Vistas -->
      <nav class="space-y-1.5 mb-6 text-xs">
        <button onclick="switchView('daily')" id="btn-daily" class="w-full text-left px-3 py-2.5 rounded-lg flex items-center gap-3 bg-purple-900/30 text-purple-200 border border-purple-500/30">
          <i class="fa-solid fa-calendar-day w-4 text-purple-400"></i> Vista Diaria
        </button>
        <button onclick="switchView('weekly')" id="btn-weekly" class="w-full text-left px-3 py-2.5 rounded-lg flex items-center gap-3 hover:bg-purple-900/20 text-purple-300">
          <i class="fa-solid fa-calendar-week w-4 text-purple-400"></i> Vista Semanal
        </button>
        <button onclick="switchView('monthly')" id="btn-monthly" class="w-full text-left px-3 py-2.5 rounded-lg flex items-center gap-3 hover:bg-purple-900/20 text-purple-300">
          <i class="fa-solid fa-calendar-days w-4 text-purple-400"></i> Vista Mensual
        </button>
        <button onclick="switchView('projects')" id="btn-projects" class="w-full text-left px-3 py-2.5 rounded-lg flex items-center gap-3 hover:bg-purple-900/20 text-purple-300">
          <i class="fa-solid fa-list-check w-4 text-purple-400"></i> Proyectos VERBENA
        </button>
        <button onclick="switchView('admin')" id="btn-admin" class="w-full text-left px-3 py-2.5 rounded-lg flex items-center gap-3 bg-purple-950/60 hover:bg-purple-900/50 text-purple-200 border border-purple-700/50">
          <i class="fa-solid fa-gears w-4 text-purple-300"></i> Panel de Administración
        </button>
      </nav>

      <!-- TO-DO LIST LATERAL -->
      <div class="border-t border-purple-900/40 pt-4">
        <div class="flex justify-between items-center mb-2">
          <h3 class="text-xs uppercase tracking-wider text-purple-400 font-bold flex items-center gap-1.5">
            <i class="fa-solid fa-list-check"></i> To-Do List Global
          </h3>
          <span id="todo-counter" class="text-[10px] bg-purple-950 border border-purple-800 px-1.5 py-0.5 rounded text-purple-300">0</span>
        </div>
        <div id="sidebar-todo-list" class="space-y-2 max-h-[240px] overflow-y-auto pr-1 text-xs"></div>
      </div>
    </div>

    <!-- Leyenda de Categorías Dinámica -->
    <div class="mt-4 pt-3 border-t border-purple-900/30">
      <h3 class="text-[10px] uppercase tracking-wider text-purple-400/80 mb-2 font-semibold">Categorías Activas</h3>
      <div id="sidebar-categories" class="flex flex-wrap gap-1.5 text-[11px]"></div>
    </div>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-1 flex flex-col h-screen overflow-y-auto relative">
    
    <!-- BARRA SUPERIOR -->
    <header class="bg-black/30 backdrop-blur-sm p-4 border-b border-purple-900/30 flex flex-wrap items-center justify-between gap-4 z-10">
      <div class="flex items-center gap-4">
        <h2 id="current-view-title" class="text-lg font-bold text
